.tl{border:3px solid var(--navy);border-radius:18px;padding:10px 6px;color:var(--navy);font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}.tl.seen{background:var(--navy);color:var(--cream)}.say{background:var(--navy);color:var(--cream);border-radius:18px;padding:12px 20px;font-size:23px;min-height:30px}.pings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.pg{border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:700;color:var(--navy)}.ex{border:0;border-radius:20px;padding:22px 14px;font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:6px;align-items:center}.ex small{font-size:17px;font-weight:400}.ex.seen{outline:5px solid var(--teal)}.dl{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:6px}.ln{display:block;text-align:left;border:0;border-radius:16px;padding:8px 14px;font-size:clamp(16px,2.1vw,20px);color:var(--navy);max-width:85%}.ln b{display:block;font-size:14px;opacity:.75}.ln.F{background:#9FD8FF;align-self:flex-start}.ln.M{background:#FFB4A2;align-self:flex-end}.ln.hl{outline:4px solid var(--sun)}.gc{border:0;border-radius:22px;padding:22px 16px;color:var(--navy);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:20px}.gc b{font-size:clamp(26px,4vw,38px)}.gc.seen{outline:5px solid var(--teal)}.gc i{font-size:clamp(19px,2.6vw,24px);font-style:normal;font-weight:600}.tm{font-size:34px;font-weight:700;color:#E8553D}.wc{border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:16px;padding:8px 6px;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}.wc.ok{background:#8FE3CF}.wc.bad{background:#FFB4A2;animation:shake .4s}.tb{width:100%;border-collapse:collapse;font-size:clamp(17px,2.3vw,21px)}.tb td{border:2px solid var(--navy);padding:6px 10px;background:#fff}</style></head><body>

<script>
const SY=['suitcase','passport','guidebook','flip-flops','raincoat','toothbrush','washbag','charger','soap','pillow','umbrella','medicine'];
const ic=(k,s=56)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-'+k+'"/></svg>';
const N=a=>a.map(t=>({t}));const GW=N(['going to','will']);
const WL=['laptop','suitcase','soap','bicycle','passport','pillow','guidebook','sandwich','flip-flops','charger','raincoat','umbrella','football','toothbrush','washbag','medicine'];
const A=[
{n:'1 · 45-second challenge',min:3,type:'words'},
{n:'2 · going to / will',min:3,type:'pres'},
{n:'3 · Complete the sentences',min:4,type:'mc',q:[
{pr:'Frank: “<b>___</b> take a small rucksack.”',o:N(['I’m going to','I’ll','We’re going to']),a:0},
{pr:'Majid: “Good idea. <b>___</b> take a small bag, too.”',o:N(['We’re going to','I’m going to','I’ll']),a:2},
{pr:'Frank: “<b>___</b> take sweatshirts and jeans.”',o:N(['I’m going to','I’ll','We’re going to']),a:0},
{pr:'Majid: “Er ... <b>___</b> take the same clothes as you.”',o:N(['I’ll','I’m going to','We’re going to']),a:0},
{pr:'Majid: “<b>___</b> visit London.”',o:N(['I’ll','We’re going to','I’m going to']),a:1},
{pr:'Majid: “<b>___</b> get some sweets for the plane!”',o:N(['We’re going to','I’ll','I’m going to']),a:1}]},
{n:'4 · The rules',min:4,type:'mc',q:[
{pr:'We use <b>going to / will</b> to talk about things we have already decided to do.',o:GW,a:0},
{pr:'We use <b>going to / will</b> when we decide at the time of speaking.',o:GW,a:1},
{pr:'I bought a ticket yesterday. I’m ___ visit London next week.',o:N(['going to','will']),a:0},
{pr:'The phone is ringing! I ___ answer it.',o:N(['’m going to','’ll']),a:1},
{pr:'We have already decided: we ___ take a guidebook.',o:N(['’ll','’re going to']),a:1},
{pr:'It’s raining and I don’t have an umbrella. I ___ borrow yours.',o:N(['’ll','’m going to']),a:0}]},
{n:'5 · Find the examples',min:3,type:'mc',q:[
{pr:'“I’ll take a small bag, too.”<br>Which one is it?',o:GW,a:1},
{pr:'“We’re going to visit London.”<br>Which one is it?',o:GW,a:0},
{pr:'“I’ll get some sweets for the plane!”<br>Which one is it?',o:GW,a:1},
{pr:'“I’m going to take sweatshirts and jeans.”<br>Which one is it?',o:GW,a:0},
{pr:'“I’ll go home and look for that now.”<br>Which one is it?',o:GW,a:1},
{pr:'“I’m going to take a small rucksack.”<br>Which one is it?',o:GW,a:0}]},
{n:'6 · Who said it?',min:4,type:'mc',q:[
{pr:'Who said, “I’m going to take a small rucksack”?',o:N(['Frank','Majid']),a:0},
{pr:'Who said, “I’ll take a small bag, too”?',o:N(['Frank','Majid']),a:1},
{pr:'Who said, “We’re going to visit London”?',o:N(['Frank','Majid']),a:1},
{pr:'Who said, “I’ll take one. We can share it”?',o:N(['Frank','Majid']),a:0},
{pr:'Who said, “I’ll download a guidebook about the city”?',o:N(['Frank','Majid']),a:0},
{pr:'Who said, “I’ll get some sweets for the plane!”?',o:N(['Frank','Majid']),a:1}]},
{n:'7 · Final task',min:4,type:'cloze'}];
const CL=6;
const C={t:'Sara bought her ticket last week. She {0} (1) visit her uncle in Dubai. She says, “I {1} (2) take my flip-flops and a pillow.” At the airport, her friend sees that Sara has no pen. Her friend says, “I {2} (3) lend you mine.” Sara says, “We {3} (4) stay in a hotel. We booked it last month.” Then she says, “Oh no! I forgot your birthday. I {4} (5) buy you a present now.”',o:[['is going to','will','are going to'],['’ll','’m going to','won’t'],['’m going to','’ll','are going to'],['’ll','’re going to','won’t'],['’ll','’m going to','are going to']],a:[0,1,1,1,0]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,seen:{},started:false,t:45,over:false,pw:{}});
let S={step:0,st:A.map(nst)},TM=null;
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784],.12,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);S.step=k;render()}
function wstart(){const s=S.st[0];clearInterval(TM);Object.assign(s,{started:true,t:45,over:false,pw:{},sc:0});tone([392,523,659],.1);TM=setInterval(()=>{s.t--;if(s.t<=0){clearInterval(TM);s.over=true;tone([523,659,784,1047],.14,'triangle')}render()},1000);render()}
function wp(w){const s=S.st[0];if(!s.started||s.over||s.pw[w])return;if(SY.includes(w)){s.pw[w]=1;s.sc++;GOOD();say(w)}else{s.pw[w]=-1;BAD()}render()}
function gc(k){const s=S.st[1];s.seen[k]=1;s.sc=Object.keys(s.seen).length;tone([660,880],.12);say(k?'Good idea! I’ll see what time it opens.':'I’m going to visit London.');render()}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){clearInterval(TM);S.st[S.step]=nst();tone([440,523],.1);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center;font-size:56px;color:#E8553D">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next part →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div><div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+o.t+'</button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+q.o[q.a].t+'.':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='words'){const ch=WL.map(w=>{const v=s.pw[w];return '<button class="wc'+(v===1?' ok':v===-1?' bad':'')+'" onclick="wp(\''+w+'\')">'+(SY.includes(w)&&v===1?ic(w,40):'')+w+'</button>'}).join('');
  return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span class="tm">'+(s.started?s.t+' s':'45 s')+'</span></div><div class="learn">Which words do you remember from Lesson 1 (Holiday equipment)? Tap them in 45 seconds. Careful: some words are not from the lesson!</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+ch+'</div><div class="fb">'+(s.over?'Time’s up! You found '+s.sc+' / 12 words.':s.started?'Found: '+s.sc+' / 12':'')+'</div><div class="row">'+(s.started&&!s.over?'':'<button class="go alt" onclick="wstart()">'+(s.over?'Play again':'Start the 45 seconds')+'</button>')+'<button class="go" onclick="go(1)">Next part →</button></div></div>'}
